<!DOCTYPE html>
<html>
<head>
  <title>USM | Application</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="/Final-Project/favicon-32x32.png">
</head>

<body>
 <header class="header">
  <img src="android-chrome-192x192.png" alt="School Logo">
  <div class="header-text">
    <h1>University of San Miguel</h1>
    <p>Careers</p>
  </div>
</header>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#About">About</a></li>
      <li><a href="page2usm.html#PicturesBenefits">Life at USM</a></li>
      <li><a href="page3usm.html">Application / Contact</a></li>
    </ul>
  </nav>

  <div class="box" id="ApplicationContact">
    <h2>Application Form</h2>

    <form action="thankyoupage.html" method="get">
      <label>Name:</label>
      <input type="text" class="redtext" placeholder="Surname, First Name, MI" required>

      <label>Email:</label>
      <input type="email" class="redtext" placeholder="Email Address..." required>

      <label>Contact Number:</label>
      <input type="text" class="redtext" placeholder="Contact Number..." required>

      <label>Job Position:</label>
      <select class="dropdown redtext" required>
        <option value="" disabled selected>(Currently Available)</option>
        <option>Grade School / High School Teacher</option>
        <option>Kindergarten / Preschool Teacher</option>
        <option>Special Education (SPED) Teacher</option>
        <option>Senior High School Strand Teacher</option>
        <option>Guidance Counselor</option>
        <option>Librarian / Library Staff</option>
        <option>Learning Support / Tutor</option>
        <option>Registrar / Enrollment Officer</option>
        <option>Finance / Accounting Staff</option>
        <option>HR / Personnel Staff</option>
        <option>Sports Coach / PE Teacher</option>
        <option>IT / Maintenance Staff</option>
      </select>

      <label>Why do you want to work at USM?</label>
      <textarea class="redtext" rows="4" required></textarea>

      <center>
        <button type="submit" class="submitbtn">Submit Application</button>
      </center>
    </form>
  </div>

  <footer>
    © 2025 University of San Miguel
    <span>Email: USMEduc@usm.edu | Phone: 123-456-7890</span>
    <div class="footer-bar"></div>
  </footer>
</body>

</html>
